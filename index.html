<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Students Registration Form </title>
</head>
<body>
    
<nav>
   <div class="header-text">
   <h1>🎓Students Registration Form!</h1>
   <p>Complete your enroliment details below.</p>
   </div>
</nav>

<form>
    <label>Name:</label>
    <input type="text" placeholder="Enter your name">
     <br><br>

    <label>Email:</label>
    <input type="text" placeholder="Enter your email">
     <br><br>

    <label>Password:</label>
    <input type="password" placeholder="Enter your password">
     <br><br>

    <label>Country:</label>
      <select>
        <option>Dubai</option>
        <option>London</option>
        <option>Pakistan</option>
        <option>Europe</option>
        <option>America</option>
        <option>Abu-Dhabi</option>
          </select> <br><br>

    <label>City:</label>
        <select>
            <option>Islamabad</option>
            <option>Karachi</option>
            <option>Quetta</option>
            <option>Lahore</option>
            <option>Peshawar</option>
            <option>Sialkot</option>
        </select> <br><br>

    <label>Date of Birth:</label>

    <div class="dob-picker">
        <div class="wheel-column" id="yearwheel"></div>

    <div class="wheel-column" id="monthwheel"></div>
    
    <div class="wheel-column" id="daywheel"></div>
</div>
   <input type="hidden" id="dobInput" name="dob">

   <label>Age:</label>
   <input type="number"><br><br>

   <label>Phone:</label>
   <input type="tel" placeholder="03000000000"><br><br>

   <label>Gender:</label>
   <br>
   <input type="radio" name="gender" value="male">
   <label>Male</label>

   <input type="radio" name="gender" value="female">
   <label>Female</label>

   <input type="radio" name="gender" value="other">
   <label>Other</label>
    <br><br>

   <label>Adress:</label>
   <input type="text" placeholder="write your adress">
   <br><br>

   <label>CNIC/B-Form Number</label>
   <input type="text" placeholder="CNIC/B-Form">
   <br><br>

   <label>Choose Track!</label>
   <select>
    <option>Web Development</option>
    <option>Graphic Designing</option>
    <option>CIT</option>
    <option>Cyber security</option>
    <option>English-language</option>
   </select> <br><br>

   <button onclick="alert('Congratolations! You are officially A Student Now 🎉')">
     Submit
   </button>
</form>
    <script src="script.js">
 </script>
</body>
</html>
